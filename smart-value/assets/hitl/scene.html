<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #1A1A4E; overflow: hidden; }
  #stage { position: relative; width: 1200px; height: 660px; }
  canvas { display: block; }
  /* Same scrim logic as the Amsterdam hero: darken the left so the headline
     and button stay legible, leave the right open for the ring. */
  #scrim { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(26,26,78,.86) 0%, rgba(26,26,78,.62) 34%,
                rgba(26,26,78,.16) 64%, rgba(26,26,78,0) 100%); }
  #sink { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; pointer-events: none;
    background: linear-gradient(180deg, rgba(26,26,78,0) 0%, rgba(26,26,78,1) 100%); }
  /* Preview-only overlay: shows how the email copy will sit on the art. */
  #preview { position: absolute; left: 112px; top: 88px; width: 520px;
    font-family: Georgia, 'Times New Roman', serif; color: #fff; display: none; }
  #preview .kicker { font: 22px/32px Arial, sans-serif; letter-spacing: 6px; color: #F19526; }
  #preview .kicker:before { content: ""; display: inline-block; width: 52px; height: 2px;
    background: #F19526; vertical-align: middle; margin-right: 24px; }
  #preview h1 { font-weight: normal; font-size: 64px; line-height: 82px; margin: 40px 0 0; }
  #preview p { font: 30px/50px Arial, sans-serif; color: #b6c0e8; margin: 30px 0 56px; }
  #preview .btn { display: inline-block; background: #7751FF; color: #fff; border-radius: 8px;
    font: bold 30px/34px Arial, sans-serif; padding: 32px 64px; }
</style>
</head>
<body>
<div id="stage">
  <div id="scrim"></div>
  <div id="sink"></div>
  <div id="preview">
    <div class="kicker">HUMAN IN THE LOOP</div>
    <h1>The insight was in the silence.</h1>
    <p>Susan Fader on what two AI reports missed.</p>
    <span class="btn">&#9654;&nbsp;&nbsp;Watch the episode</span>
  </div>
</div>
<script type="module">
import * as THREE from './node_modules/three/build/three.module.min.js';

// '#banner' renders a standalone band with the loop centred, for use as a real
// <img> above the headline. Default renders the text-overlay hero.
const BANNER = location.hash === '#banner';
const W = 1200, H = BANNER ? 500 : 660;
if (BANNER) {
  document.getElementById('stage').style.height = H + 'px';
  document.getElementById('scrim').style.display = 'none';
  document.getElementById("sink").style.height = "56px";
}
const NAVY = 0x1A1A4E, PURPLE = 0x7751FF, LAVENDER = 0xB3A6FF, AMBER = 0xF19526;

if (location.hash === '#preview') document.getElementById('preview').style.display = 'block';

// Seeded PRNG: the render is identical every time it is rebuilt.
let seed = 20260923;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(NAVY, 1);
document.getElementById('stage').prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(NAVY, 7.5, 15);

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
if (BANNER) { camera.position.set(0, 2.55, 6.6); camera.lookAt(0, 0.3, 0); }
else { camera.position.set(-1.2, 3.4, 9.2); camera.lookAt(-0.9, 0.45, 0); }

// ---- The loop: a ring of bars, two voices taking turns ------------------
const ring = new THREE.Group();
if (BANNER) { ring.position.set(0, 0, 0); ring.rotation.y = 0; }
else { ring.position.set(1.72, 0, 0.3); ring.rotation.y = -0.35; }
scene.add(ring);

const N = 200, R = 1.92;
// Angle 90deg faces the camera. The silence sits just right of front,
// nearest the viewer, where the eye lands after the headline.
ring.updateMatrixWorld(true);
const camLocal = ring.worldToLocal(camera.position.clone());
const FRONT = Math.atan2(camLocal.z, camLocal.x);            // angle facing the camera
const SILENT_LEN = 16;
const SILENT_CENTRE = FRONT - 0.42;                          // a little right of front
const wrap = a => (a % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
const SILENT_START = Math.round(wrap(SILENT_CENTRE) / (Math.PI * 2) * N) - SILENT_LEN / 2;
const isSilent = i => { const d = ((i - SILENT_START) % N + N) % N; return d < SILENT_LEN; };

const barGeo = new THREE.BoxGeometry(0.052, 1, 0.052);
barGeo.translate(0, 0.5, 0);                       // grow up from the floor
const bars = new THREE.InstancedMesh(barGeo, new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.78 }), N);

// Speech-like heights: alternating turns of uneven length, each tapered at
// the edges the way a sentence rises and falls, rough within the turn.
const heights = new Array(N).fill(0), voice = new Array(N).fill(0);
let i = 0, speaker = 0;
while (i < N) {
  const len = 9 + Math.floor(rnd() * 20);
  const peak = 0.45 + rnd() * 0.6;
  for (let k = 0; k < len && i < N; k++, i++) {
    const taper = Math.sin(Math.PI * (k + 0.5) / len);
    const rough = 0.35 + 0.65 * Math.abs(Math.sin(k * 1.7 + rnd() * 3.1)) * (0.6 + 0.4 * rnd());
    heights[i] = Math.max(0.05, peak * taper * rough);
    voice[i] = speaker;
  }
  if (rnd() > 0.2) speaker ^= 1;                   // occasionally the same voice continues
}

const m = new THREE.Matrix4(), c = new THREE.Color();
for (let j = 0; j < N; j++) {
  const a = (j / N) * Math.PI * 2;
  const x = Math.cos(a) * R, z = Math.sin(a) * R;
  const h = isSilent(j) ? 0.018 : heights[j];
  m.makeScale(1, h, 1).setPosition(x, 0, z);
  bars.setMatrixAt(j, m);
  if (isSilent(j)) c.setHex(0x3A3A82);
  else c.setHex(voice[j] ? LAVENDER : PURPLE);
  bars.setColorAt(j, c);
}
ring.add(bars);

// Floor trace of the loop, so the ring reads as a circle even where bars are low.
const trace = new THREE.Mesh(
  new THREE.RingGeometry(R - 0.012, R + 0.012, 256),
  new THREE.MeshBasicMaterial({ color: PURPLE, transparent: true, opacity: 0.28, side: THREE.DoubleSide }));
trace.rotation.x = -Math.PI / 2;
ring.add(trace);

// Amber arc on the floor under the silence.
const a0 = (SILENT_START / N) * Math.PI * 2, a1 = ((SILENT_START + SILENT_LEN) / N) * Math.PI * 2;
const arc = new THREE.Mesh(
  new THREE.RingGeometry(R - 0.03, R + 0.03, 64, 1, a0, a1 - a0),
  new THREE.MeshBasicMaterial({ color: AMBER, transparent: true, opacity: 0.85, side: THREE.DoubleSide }));
arc.rotation.x = -Math.PI / 2;
arc.scale.set(1, -1, 1);                            // RingGeometry runs counter to our angle
ring.add(arc);

// ---- The insight: a soft amber light in the gap -------------------------
function glowTexture(inner, outer) {
  const s = 256, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d'), gr = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  // Fade to nothing by half the radius, so the sprite's square edge can never show.
  gr.addColorStop(0, inner); gr.addColorStop(0.12, outer); gr.addColorStop(0.5, 'rgba(241,149,38,0)'); gr.addColorStop(1, 'rgba(241,149,38,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
  return new THREE.CanvasTexture(cv);
}
const mid = (a0 + a1) / 2;
const gx = Math.cos(mid) * R, gz = Math.sin(mid) * R;

const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTexture('rgba(255,214,150,0.42)', 'rgba(241,149,38,0.16)'),
  blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, fog: false }));
halo.scale.set(1.9, 1.9, 1); halo.position.set(gx, 0.46, gz);
ring.add(halo);

const core = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTexture('rgba(255,236,205,1)', 'rgba(241,149,38,0.9)'),
  blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, fog: false }));
core.scale.set(0.36, 0.36, 1); core.position.set(gx, 0.46, gz);
ring.add(core);

// ---- Dust: a few motes drifting through the room ------------------------
const dustN = 140, pos = new Float32Array(dustN * 3);
for (let d = 0; d < dustN; d++) {
  pos[d*3]   = -3 + rnd() * 10;
  pos[d*3+1] = rnd() * 3.4;
  pos[d*3+2] = -4 + rnd() * 7;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
scene.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: LAVENDER, size: 0.022, transparent: true, opacity: 0.35 })));

renderer.render(scene, camera);
document.title = 'rendered';
</script>
</body>
</html>
