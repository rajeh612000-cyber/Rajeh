<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Cutdown frame furniture</title>
<link rel="stylesheet" href="./assets/fonts/sora.css">
<style>
  :root{ --ink:#1a1a4e; --num:#a09de8; --border:#e0dff8; --accent:#f19526; --void:#0a0a23; --navy:#191a4e; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  #frame{
    position:relative;width:1080px;height:1920px;
    font-family:'Sora',sans-serif;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(119,81,255,.10), rgba(10,10,35,0) 60%),
      radial-gradient(120% 60% at 50% 100%, rgba(83,74,183,.10), rgba(10,10,35,0) 60%),
      #191a4e;
  }
  body.square #frame{width:1080px;height:1080px}

  .band{position:absolute;left:0;right:0;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:18px;padding:0 70px;text-align:center}
  .top{top:0;height:656px}
  .bot{bottom:0;height:656px}
  body.square .top{height:236px}
  body.square .bot{height:236px}

  .kick{font-size:21px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--num)}
  body.square .kick{font-size:17px}
  .head{font-size:62px;font-weight:300;line-height:1.14;letter-spacing:-.018em;color:#fff;text-wrap:balance}
  .head b{font-weight:700}
  body.square .head{font-size:40px}
  .logo{width:420px;display:block;border-radius:10px}
  body.square .logo{width:290px}
  .cta{font-size:22px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#1a1a4e;
       background:var(--accent);padding:20px 34px;border-radius:16px 16px 16px 5px;
       box-shadow:0 12px 36px rgba(241,149,38,.38)}
  body.square .cta{font-size:16px;padding:14px 24px}
  .sub{font-size:20px;font-weight:300;color:rgba(224,223,248,.72)}
  body.square .sub{font-size:15px}

  /* The window the film plays through. The picture is composited on top of
     this frame at exactly these coordinates; the border and glow sit proud of
     it, so they survive the overlay and read as a lit panel. */
  .window{position:absolute;left:0;right:0;height:608px;top:656px;
          border-radius:20px 20px 20px 6px;
          box-shadow:0 0 0 1px rgba(224,223,248,.16), 0 30px 90px rgba(83,74,183,.28);}
  body.square .window{height:608px;top:236px}
</style>
</head>
<body>
  <div id="frame">
    <div class="band top">
      <div class="kick">Price Optimizer</div>
      <div class="head">Find the price that grows<br>revenue and margin<br><b>without losing volume.</b></div>
    </div>
    <div class="window"></div>
    <div class="band bot">
      <img class="logo" src="./assets/brand/logo-lockup.png" alt="Smart Value AI Solutions">
      <div class="sub">Standalone solution. No bundle.</div>
      <div class="cta">Book a walkthrough</div>
    </div>
  </div>
</body>
</html>
